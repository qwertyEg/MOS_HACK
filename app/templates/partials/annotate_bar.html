{#- Кнопка и панель режима «Разметка» (страницы кадра и камеры). -#}
<template x-if="$data.ann && frame && frame.id">
  <div class="flex flex-wrap items-center gap-1.5">
    <template x-if="!ann.on">
      <button type="button" class="btn btn-secondary btn-sm" @click="annToggle(true)" title="Разметка: исправить класс, удалить ложную или дорисовать пропущенную рамку (E)">
        <span x-html="$icon('pencil', 'w-3.5 h-3.5')"></span><span>Разметка</span><span x-show="annVerified" class="badge badge-good !h-4 !px-1" title="Разметка кадра проверена вручную"><span x-html="$icon('check', 'w-2.5 h-2.5')"></span></span></button>
    </template>
    <template x-if="ann.on">
      <div class="flex flex-wrap items-center gap-1.5">
        <div class="seg" role="group" aria-label="Инструмент разметки">
          <button type="button" :aria-pressed="ann.tool === 'select'" @click="annTool('select')" title="Выбрать рамку и исправить">
            <span x-html="$icon('scan', 'w-3.5 h-3.5')"></span><span class="hidden sm:inline">Выбрать</span></button>
          <button type="button" :aria-pressed="ann.tool === 'draw'" @click="annTool('draw')" title="Дорисовать пропущенную рамку (N)">
            <span x-html="$icon('plus', 'w-3.5 h-3.5')"></span><span>Рамка</span></button>
        </div>
        <button type="button" class="btn btn-sm" :class="annVerified ? 'btn-info' : 'btn-secondary'" :disabled="ann.busy" @click="annVerify(!annVerified)"
                :title="annVerified ? 'Снять отметку «разметка проверена» (V)' : 'Все рамки кадра верны — кадр пойдёт в датасет как проверенный (V)'">
          <span x-html="$icon('check', 'w-3.5 h-3.5')"></span><span x-text="annVerified ? 'Проверен' : 'Кадр верен'"></span></button>
        <button type="button" class="btn btn-ghost btn-sm btn-icon" :disabled="!ann.history.length || ann.busy" @click="annUndo()" title="Отменить последнюю правку" aria-label="Отменить последнюю правку">
          <span x-html="$icon('undo', 'w-3.5 h-3.5')"></span></button>
        <button type="button" class="btn btn-primary btn-sm" @click="annToggle(false)" title="Выйти из разметки (Esc)">Готово</button>
      </div>
    </template>
  </div>
</template>
