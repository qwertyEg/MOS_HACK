{#- Вкладка «Отклонения»: лента карточек с объяснением и снимками-доказательствами, квитирование. -#}
{%- import "partials/icons.html" as ic -%}
<div>
  <div class="mb-4 flex flex-wrap items-center gap-2">
    <div class="seg" role="tablist" aria-label="Статус отклонений">
      <button type="button" role="tab" :aria-selected="devStatus === 'open'" @click="devStatus = 'open'">Открытые<span class="num text-fg-3" x-text="devTabCounts.open"></span></button>
      <button type="button" role="tab" :aria-selected="devStatus === 'ack'" @click="devStatus = 'ack'">Квитированные<span class="num text-fg-3" x-text="devTabCounts.ack"></span></button>
      <button type="button" role="tab" :aria-selected="devStatus === 'resolved'" @click="devStatus = 'resolved'" title="Условие больше не держится — закрыто автоматически">Закрытые<span class="num text-fg-3" x-text="devTabCounts.resolved"></span></button>
      <button type="button" role="tab" :aria-selected="devStatus === 'all'" @click="devStatus = 'all'">Все<span class="num text-fg-3" x-text="devTabCounts.all"></span></button>
    </div>
    <div class="flex items-center gap-1.5" role="group" aria-label="Серьёзность">
      <template x-for="k in ['critical', 'warning', 'info']" :key="k">
        <button type="button" class="inline-flex h-8 items-center gap-1.5 rounded-lg border px-2.5 text-xs font-medium transition-colors"
                :class="devSev[k] ? 'border-line-strong bg-panel text-fg' : 'border-line text-fg-3 line-through'" :aria-pressed="devSev[k]" @click="devSev[k] = !devSev[k]">
          <span :class="SV.toneText[SV.META.severity[k].tone]" x-html="$icon(SV.META.severity[k].icon, 'w-3.5 h-3.5')"></span><span x-text="SV.META.severity[k].label"></span>
        </button>
      </template>
    </div>
    <p class="ml-auto hidden text-xs text-fg-3 md:block">Отклонение живёт, пока условие держится; «квитировать» — значит «видел, разбираемся».</p>
  </div>

  <template x-if="!devs">
    <div class="space-y-3"><template x-for="i in 3"><div class="card p-4"><div class="skeleton h-3 w-40"></div><div class="skeleton mt-3 h-4 w-2/3"></div><div class="skeleton mt-2 h-3 w-full"></div><div class="mt-3 flex gap-2"><div class="skeleton h-20 w-32"></div><div class="skeleton h-20 w-32"></div></div></div></template></div>
  </template>

  <div class="space-y-3" x-show="devs">
    <template x-for="d in shownDevs" :key="d.id">
      <article class="card relative overflow-hidden animate-fade-in" :class="d.status && d.status !== 'open' && 'opacity-75'">
        <span class="absolute inset-y-0 left-0 w-1" :class="SV.toneBg[sevMeta(d).tone]"></span>
        <div class="flex flex-col gap-4 p-4 pl-5 sm:p-5 sm:pl-6 lg:flex-row">
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
              <span class="badge" :class="SV.toneBadge[sevMeta(d).tone]"><span x-html="$icon(sevMeta(d).icon, 'w-3 h-3')"></span><span x-text="sevMeta(d).label"></span></span>
              <span class="text-xs font-medium text-fg-2" x-text="SV.META.devType[d.type] || d.type"></span>
              <span class="text-xs text-fg-3" x-text="devWhen(d)"></span>
              <span x-show="d.status === 'ack'" class="badge badge-outline">{{ ic.icon("check", "w-3 h-3") }} квитировано</span>
              <span x-show="d.status === 'resolved'" class="badge badge-good" :title="d.data && d.data.auto_resolved ? 'Условие перестало выполняться' : ''">{{ ic.icon("check-circle", "w-3 h-3") }} закрыто<span x-show="d.data && d.data.resolved_at" x-text="' ' + SV.fmt.dateTime(d.data && d.data.resolved_at)"></span></span>
            </div>
            <h3 class="mt-2 text-[15px] font-semibold leading-5 tracking-[-0.01em]" x-text="d.title"></h3>
            <p class="mt-1.5 max-w-3xl text-sm leading-[21px] text-fg-2" x-text="d.message"></p>
            <div class="mt-3 flex flex-wrap gap-1.5 text-2xs">
              <template x-if="d.stage_name || d.stage_id">
                <span class="inline-flex h-6 items-center gap-1 rounded-md bg-panel-3 px-2 text-fg-2">{{ ic.icon("calendar", "w-3 h-3 text-fg-3") }}<span x-text="d.stage_name || ('Этап ' + d.stage_id)"></span></span>
              </template>
              <template x-if="d.zone_name">
                <span class="inline-flex h-6 items-center gap-1 rounded-md bg-panel-3 px-2 text-fg-2">{{ ic.icon("pentagon", "w-3 h-3 text-fg-3") }}<span x-text="'Зона «' + d.zone_name + '»'"></span></span>
              </template>
              <template x-if="devCams(d).length">
                <span class="inline-flex h-6 items-center gap-1 rounded-md bg-panel-3 px-2 text-fg-2">{{ ic.icon("camera", "w-3 h-3 text-fg-3") }}<span x-text="devCams(d).join(', ')"></span></span>
              </template>
              <template x-if="(d.unit_ids || []).length">
                <span class="inline-flex h-6 items-center gap-1 rounded-md bg-panel-3 px-2 text-fg-2">{{ ic.icon("truck", "w-3 h-3 text-fg-3") }}<span x-text="devUnits(d).join(', ')"></span></span>
              </template>
            </div>
          </div>

          <div class="flex shrink-0 flex-col gap-3 lg:w-[440px] lg:items-end">
            <div class="grid w-full grid-cols-2 gap-2 sm:grid-cols-4 lg:grid-cols-2 xl:grid-cols-4">
              <template x-for="(f, i) in devFrames(d)" :key="f.id">
                <button type="button" data-evidence class="group relative aspect-[5/4] overflow-hidden rounded-lg border border-line bg-panel-3 focus-visible:ring-2 focus-visible:ring-info"
                        @click="openEvidence(d, f.id)" :aria-label="'Открыть снимок ' + (i + 1)">
                  <img :src="thumb(f)" alt="" loading="lazy" class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105">
                  <span class="absolute bottom-1 left-1 rounded bg-black/65 px-1 text-[10px] font-medium leading-4 text-white" x-text="f.captured_at ? SV.fmt.dateTime(f.captured_at) : 'снимок ' + (i + 1)"></span>
                  <span class="absolute right-1 top-1 hidden rounded bg-black/65 p-0.5 text-white group-hover:block" x-html="$icon('scan', 'w-3 h-3')"></span>
                </button>
              </template>
              <template x-if="!devFrames(d).length">
                <div class="col-span-full flex items-center gap-2 rounded-lg border border-dashed border-line-strong p-3 text-xs text-fg-3">{{ ic.icon("image", "w-4 h-4") }} Снимков нет: отклонение по плану или по отсутствию техники.</div>
              </template>
            </div>
            <div class="flex gap-2">
              <template x-if="!d.status || d.status === 'open'">
                <button type="button" class="btn btn-secondary btn-sm" @click="setDevStatus(d, 'ack')">{{ ic.icon("check") }} Квитировать</button>
              </template>
              <template x-if="d.status === 'ack'">
                <button type="button" class="btn btn-ghost btn-sm" @click="setDevStatus(d, 'open')">{{ ic.icon("undo") }} Вернуть в открытые</button>
              </template>
              <template x-if="d.status !== 'resolved'">
                <button type="button" class="btn btn-ghost btn-sm" @click="setDevStatus(d, 'resolved')" title="Причина устранена — закрыть вручную">{{ ic.icon("check-circle") }} Закрыть</button>
              </template>
            </div>
          </div>
        </div>
      </article>
    </template>
    <template x-if="devs && !shownDevs.length">
      <div class="card empty">
        <div class="empty-icon text-good-fg">{{ ic.icon("check-circle") }}</div>
        <p class="font-medium" x-text="devStatus === 'open' ? 'Открытых отклонений нет' : 'Здесь пусто'"></p>
        <p class="max-w-sm text-sm text-fg-3">Правила «этап → техника», простои и сверка с графиком проверяются после каждого кадра — новое отклонение появится здесь само.</p>
      </div>
    </template>
  </div>
</div>
